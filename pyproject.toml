[project]
name = "python-budget-tracker-app"
version = "0.1.0"
description = "Offline budget & subscription tracker built with FastAPI, Pydantic and Alpine.js, with design docs, traceability and unit/integration tests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shimpei Ohtani" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/shim369/Python-Budget-Tracker-App"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient suggests httpx2; we keep httpx (dev dependency) for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
